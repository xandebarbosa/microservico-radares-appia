## #############################################
#  HTTP
## #############################################
server.port=8092

## #############################################
#  MONGODB
## #############################################
spring.data.mongodb.uri=${CONNECTION_URI_MONGODB}
spring.data.mongodb.database=${DATABASE_MONGODB}

## #############################################
#  RABBITMQ
## #############################################
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Custom properties lidas pela classe RabbitMQConfig e RadarMqPublisher
rabbitmq.exchange.name=radares_exchange
rabbitmq.routing.key=radares.appia

# Reconexão (Spring AMQP)
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=5000ms
# Valor alto para simular tentativas infinitas (-1 não é suportado diretamente no max-attempts do Spring)
spring.rabbitmq.template.retry.max-attempts=10000

# Spring Cloud Stream (Equivalente ao SmallRye Messaging)
spring.cloud.stream.bindings.radares-out-0.destination=radares_exchange
spring.cloud.stream.rabbit.bindings.radares-out-0.producer.routing-key-expression='radares.appia'
spring.cloud.stream.rabbit.bindings.radares-out-0.producer.exchange-type=direct
spring.cloud.stream.rabbit.bindings.radares-out-0.producer.exchange-durable=true

## #############################################
#  OPENAPI / SWAGGER UI (Requer a lib springdoc-openapi-starter-webmvc-ui)
## #############################################
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs
springdoc.info.title=API Radares Concessionária APPIA
springdoc.info.version=1.0.0
springdoc.info.description=Microsserviço de leituras de radares ? Concessionária APPIA

## #############################################
#  HEALTH CHECK E MÉTRICAS (Requer spring-boot-starter-actuator e micrometer-registry-prometheus)
## #############################################
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
# No Spring, os paths já são /actuator/health e /actuator/prometheus por padrão

## #############################################
#  LOGGING E BANNER
## #############################################
spring.main.banner-mode=console
logging.level.com.inteligencia=DEBUG

## #############################################
#  EUREKA (Requer spring-cloud-starter-netflix-eureka-client)
## #############################################
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}



