spring.application.name=microservico-radares-appia
info.app.version=1.0.0

# 1. Define o perfil de producao como ativo
spring.profiles.active=prod
#spring.profiles.active=prod

# A aplica\u00E7ao tentara buscar o config server, se falhar (optional:),
# ela continuara e usara o 'application-prod.properties' local como fallback.
spring.config.import=optional:configserver:http://config-server:8888

cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}